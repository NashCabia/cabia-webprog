<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Aquarium care illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#101a36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="0.6" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- tank outline -->
  <rect x="280" y="180" width="1040" height="600" rx="38" fill="#0f172a" stroke="#312e81" stroke-width="6"/>
  <rect x="310" y="210" width="980" height="540" rx="30" fill="#0b1228"/>

  <!-- water line -->
  <path d="M310 340c120 28 220-28 340 0s220 28 340 0 220-28 300 0v410H310V340Z" fill="#0b2a4a" opacity="0.55"/>

  <!-- plants -->
  <g opacity="0.9">
    <path d="M470 740c-20-130 40-220 40-220s60 110 40 220" fill="#22c55e" opacity="0.25"/>
    <path d="M560 740c-18-110 36-190 36-190s55 95 36 190" fill="#22c55e" opacity="0.22"/>
    <path d="M1080 740c-18-120 38-210 38-210s58 105 38 210" fill="#22c55e" opacity="0.22"/>
  </g>

  <!-- care accent (purple ribbon) -->
  <path d="M520 440c210-160 430-160 560 0-130 180-350 220-560 0Z" fill="url(#accent)" opacity="0.9"/>
  <circle cx="1020" cy="420" r="12" fill="#e9d5ff"/>

  <!-- bubbles -->
  <g opacity="0.55">
    <circle cx="420" cy="420" r="9" fill="#c4b5fd"/>
    <circle cx="450" cy="470" r="6" fill="#a78bfa"/>
    <circle cx="1180" cy="400" r="8" fill="#22d3ee"/>
    <circle cx="1210" cy="460" r="6" fill="#c4b5fd"/>
  </g>
</svg>
