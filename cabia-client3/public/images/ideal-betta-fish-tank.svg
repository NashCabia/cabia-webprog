<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Tank setup illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#0c1b3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- rocks -->
  <path d="M520 720c60-120 190-160 270-60 50-70 160-90 230 10 70-60 160-30 200 50H520Z" fill="#111827" opacity="0.9"/>

  <!-- plants -->
  <g opacity="0.35">
    <path d="M360 740c10-170 70-280 70-280s70 130 60 280" fill="#22c55e"/>
    <path d="M1240 740c10-170 70-280 70-280s70 130 60 280" fill="#22c55e"/>
  </g>

  <!-- accent sweep -->
  <path d="M360 520c280-260 620-260 900 0-240 280-660 330-900 0Z" fill="url(#accent)" opacity="0.9"/>

  <!-- bubbles -->
  <g opacity="0.55">
    <circle cx="760" cy="230" r="9" fill="#c4b5fd"/>
    <circle cx="800" cy="280" r="6" fill="#a78bfa"/>
    <circle cx="840" cy="220" r="7" fill="#22d3ee"/>
  </g>
</svg>
