<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Feeding guide illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1a1242"/>
    </linearGradient>
    <linearGradient id="fish" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- pellets -->
  <g opacity="0.9">
    <circle cx="1040" cy="220" r="10" fill="#f59e0b"/>
    <circle cx="1100" cy="260" r="9" fill="#fbbf24"/>
    <circle cx="1160" cy="210" r="8" fill="#f59e0b"/>
    <circle cx="1120" cy="320" r="8" fill="#fbbf24"/>
    <circle cx="1200" cy="290" r="9" fill="#f59e0b"/>
  </g>

  <!-- fish -->
  <path d="M420 520c170-170 430-170 600 0-170 170-430 170-600 0Z" fill="url(#fish)"/>
  <path d="M380 520c-120-70-180-170-180-170 160 30 240 95 290 135-35 10-70 25-110 35Z" fill="#22d3ee" opacity="0.45"/>
  <path d="M380 520c-120 70-180 170-180 170 160-30 240-95 290-135-35-10-70-25-110-35Z" fill="#c4b5fd" opacity="0.55"/>
  <circle cx="900" cy="490" r="14" fill="#e9d5ff"/>
  <circle cx="904" cy="486" r="6" fill="#0b1020" opacity="0.9"/>

  <!-- feeding arc -->
  <path d="M1020 240c-40 150-200 260-360 280" fill="none" stroke="#c4b5fd" stroke-width="6" stroke-linecap="round" opacity="0.65"/>
</svg>
